<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
     <header>
        <div class="logo-container">
            <div class="logo-blade-container back-blade">
                <div class="logo-blade-tip"></div>
                <div class="logo-blade-body"></div>
                <div class="logo-blade-guard"></div>
                <div class="logo-blade-grip"></div>
            </div>

            <div class="logo-blade-container front-blade">
                <div class="logo-blade-tip"></div>
                <div class="logo-blade-body front-blade-body-shadow"></div>
                <div class="logo-blade-guard"></div>
                <div class="logo-blade-grip"></div>
            </div>
        </div>

        
        <ul class="menu-list-container">
            <li id="btn-anime" class="btn-container btnActive"><a href="#">Anime</a></li>
            <li id="btn-hero" class="btn-container"><a href="#">Hero</a></li>
            <li id="btn-hypno" class="btn-container"><a href="#">Hypnotise</a></li>
        </ul>      
    </header>

    <section class="section-container sectionActive" id="sec-anime">

        <!-- Início do Ryuk -->
        <article class="card-container ryuk-background">
            <div class="ryuk-hair"></div>
            <div class="ryuk-eye-contour ryuk-left-eye">
                <div class="ryuk-eye-dark-green-circle">
                    <div class="ryuk-eye-light-green-circle">
                        <div class="ryuk-eye-brown-circle">
                        </div>
                    </div>
                </div>
            </div>

            <div class="ryuk-eye-contour ryuk-right-eye">
                <div class="ryuk-eye-dark-green-circle" id="ryuk-right-eye-rotate">
                    <div class="ryuk-eye-light-green-circle">
                        <div class="ryuk-eye-brown-circle">
                        </div>
                    </div>
                </div>
            </div>
        </article>
        <!-- Fim do Ryuk -->


        <!-- Início do Amegakure -->
        <article class="card-container amegakure-background">
            <div class="amegakure-hitai-ate">
                <div class="amegakure-plate">
                    <div class="amegakure-circle"></div>
                    <div class="amegakure-reflex"></div>
                    <div class="amegakure-skyscrapers"></div>
                </div>
            </div>
        </article>
        <!-- Fim do Amegakure -->

        <!-- Início do Kurama -->
        <article class="card-container kurama-background">
            <div class="kurama-eye-contour">
                <div class="kurama-eye-white">
                    <div class="kurama-eye-red">
                        <div class="kurama-eye-black"></div>
                    </div>
                </div>
            </div>
        </article>
        <!-- Fim do Kurama -->

        <!-- Início do Sharingan -->
        <!-- <article class="card-container sharingan-container">
            <div class="sharingan-red-circle">
                <div class="sharingan-black-circle">
                    <div class="sharingan-square sharingan-top-square"></div>
                    <div class="sharingan-square sharingan-left-square"></div>
                    <div class="sharingan-square sharingan-right-square"></div>
                    <div class="sharingan-tomoe sharingan-left-tomoe"></div>
                    <div class="sharingan-tomoe sharingan-right-tomoe"></div>
                    <div class="sharingan-tomoe sharingan-bottom-tomoe"></div>
                </div>
            </div>
        </article> -->
        <!-- Fim do Sharingan -->

        <!-- Início do Obito -->
        <article class="card-container obito-container">
            <div class="obito-mask-hole">
                <div class="obito-white-eye">
                    <div class="obito-red-eye">
                        <div class="obito-black-eye-circle"></div>
                        <div class="obito-tomoe obito-tomoe-top"></div>
                        <div class="obito-tomoe obito-tomoe-bottom-left"></div>
                        <div class="obito-tomoe obito-tomoe-bottom-right"></div>
                    </div>
                </div>
            </div>
        </article>
        <!-- Fim do Obito -->
        

        <!-- Início do One Piece -->
        <article class="card-container one-piece-background">
            <div class="one-piece-circle-bone"></div>
            <div class="one-piece-square-bone"></div>
            <div class="one-piece-face">
                <div class="one-piece-eye"></div>
                <div class="one-piece-right-eye"></div>
            </div>
            <div class="one-piece-tooth"></div>
        </article>
        <!-- Fim do One Piece -->
 
    </section>


    <section class="section-container" id="sec-hero">

        <!-- Início do Punisher -->
        <article class="card-container punisher-container">
            <div class="punisher-face js-punisher-black js-punisher-shadow">
                <div class="punisher-eye punisher-left-eye js-punisher-shadow"></div>
                <div class="punisher-nose"></div>
                <div class="punisher-eye punisher-right-eye js-punisher-shadow"></div>
            </div>
            <div class="punisher-jaw js-punisher-black"></div>
            <div class="punisher-teeth-container">
                <div class="punisher-teeth js-punisher-black"></div>
                <div class="punisher-teeth js-punisher-black"></div>
                <div class="punisher-teeth js-punisher-black"></div>
                <div class="punisher-teeth js-punisher-black"></div>
            </div>
        </article>
        <!-- Fim do Punisher -->

        <!-- Início do Wolverine -->

        <!--<article class="card-container wolverine-container">
            <div class="wolverine-eye-contour wolverine-left-contour">
                <div class="wolverine-eye wolverine-left-eye"></div>
            </div>
            <div class="wolverine-eye-contour wolverine-right-contour">
                <div class="wolverine-eye wolverine-right-eye"></div>
            </div>
            <div class="wolverine-mouth"></div>
            <div class="orange-circle"></div>
        </article>-->

        <article class="card-container wolverine-background">
            <div class="wolverine-head js-wolverine">
                <div class="wolverine-eye-countour wolverine-left-countour js-wolverine" >
                    <div class="wolverine-eye wolverine-left-eye js-wolverine"></div>
                </div>
                <div class="wolverine-eye-countour wolverine-right-countour js-wolverine">
                    <div class="wolverine-eye wolverine-right-eye js-wolverine" ></div>
                </div>
            </div>
            <div class="wolverine-jaw">
                <div class="wolverine-chin js-wolverine">
                    <div class="wolverine-mouth js-wolverine"></div>
                </div>
            </div>
        </article>
        <!-- Fim do Wolverine -->

        <!-- Início do Green Lantern -->
        <article class="card-container green-lantern-background" role="button" tabindex="0" aria-labelledby="green-lantern-title">
            <h2 id="green-lantern-title" class="sr-only">Lanterna Verde</h2>
            <div class="green-lantern-outside-circle js-lantern" aria-hidden="true">
                <div class="green-lantern-rectangle-top js-lantern">
                </div>
                <div class="green-lantern-inside-circle js-lantern">
                    <div class="green-lantern-core">

                    </div>
                </div>
                <div class="green-lantern-rectangle-bottom js-lantern">
                </div>

            </div>
        </article>
        <!-- Fim do Green Lantern -->

    </section>

    <section class="section-container" id="sec-hypno">

         <!-- Início do Look Away -->
        <article class="card-container look-away-background">
            <div class="look-away-body">
                <div class="look-away-amarelo js-lookAway"></div>
                <div class="look-away-laranja js-lookAway"></div>
                <div class="look-away-rosa js-lookAway"></div>
                <div class="look-away-eye look-away-left-eye"></div>
                <div class="look-away-eye look-away-right-eye"></div>
                <div class="look-away-eye-circle"></div>
            </div>
        </article>
        <!-- Fim do Look Away -->

        <!-- Início do Atom -->
        <article class="card-container atom-background">
            <div class="core js-atom"></div>
            <div class="atom white-rim js-atom"></div>
            <div class="atom green-rim js-atom"></div>
            <div class="atom orange-rim js-atom"></div>
        </article>
        <!-- Fim do Atom -->

        <!-- Início do Fountain -->
        <article class="card-container fountain-background">
            <div class="fountain-outside fountain-top js-fountain">
                <div class="fountain-inside fountain-in-adjust"></div>
            </div>
            <div class="fountain-outside fountain-left js-fountain">
                <div class="fountain-inside"></div>
            </div>
            <div class="fountain-outside fountain-right fountain-out-adjust js-fountain">
                <div class="fountain-inside fountain-in-adjust"></div>
            </div>
        </article>
        <!-- Fim do Fountain -->

        <!-- Início do Mosaic -->
        <article class="card-container mosaic-container">
            <div class="mosaic__block mosaic__block--extra-large mosaic--top-left">
                <div class="mosaic__block mosaic__block--large">
                    <div class="mosaic__block mosaic__block--medium">
                        <div class="mosaic__block mosaic__block--small"></div>
                    </div>
                </div>
            </div>

            <div class="mosaic__block mosaic__block--extra-large mosaic--top-right">
                <div class="mosaic__block mosaic__block--large">
                    <div class="mosaic__block mosaic__block--medium">
                        <div class="mosaic__block mosaic__block--small"></div>
                    </div>
                </div>
            </div>

            <div class="mosaic__block mosaic__block--extra-large mosaic--bottom-left">
                <div class="mosaic__block mosaic__block--large">
                    <div class="mosaic__block mosaic__block--medium">
                        <div class="mosaic__block mosaic__block--small"></div>
                    </div>
                </div>
            </div>

            <div class="mosaic__block mosaic__block--extra-large mosaic--bottom-right">
                <div class="mosaic__block mosaic__block--large">
                    <div class="mosaic__block mosaic__block--medium">
                        <div class="mosaic__block mosaic__block--small"></div>
                    </div>
                </div>
            </div>
        </article>
        <!-- Fim do Mosaic -->

        <!-- Início do Monopoly -->

        <article class="card-container monopoly-background">
            <div class="monopoly-hat js-monopoly"></div>
            <div class="monopoly-face-container">
                <div class="monopoly-eye-container">
                    <div class="monopoly-eye-left js-monopoly"></div>
                    <div  class="monopoly-eye-right js-monopoly"></div>
                </div>
                <div class="monopoly-mustache-container">
                    <div class="monopoly-mustache monopoly-mustache-left js-monopoly"></div>
                    <div class="monopoly-mustache monopoly-mustache-right js-monopoly"></div>
                </div> 
            </div>
        </article>

        <!-- Fim do Monopoly -->
        
    </section>

</body>
</html>
